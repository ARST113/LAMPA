name: Build Lampa client with Chromium AC3/EAC3 runtime

# Собирает официальный клиент Lampa (ARST113/LAMPA) и проверяет его на Android-эмуляторе
# стандартного GitHub-раннера (ubuntu-latest + KVM): установка, запуск, logcat, скриншот.
#
# Работает только на ветке feature/chromium-ac3-runtime — исходники main не трогаем.
on:
  push:
    branches: [feature/chromium-ac3-runtime]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor LAMPA для сборки'
        required: false
        default: lite
        type: choice
        options: [lite, full, ruStore, chromium]
      api_level:
        description: 'API уровень эмулятора'
        required: false
        default: '29'
        type: choice
        options: ['29', '34', '35']
      abi:
        description: 'ABI рантайма (arm64-v8a — устройство, x86_64 — эмулятор)'
        required: false
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, x86_64]
      engine:
        description: 'Движок для эмуляторной проверки'
        required: false
        default: Cefrium
        type: choice
        options: [default, XWalk, Cefrium, SysView]
      run_emulator:
        description: 'Прогонять проверку на эмуляторе'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: lampa-chromium-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # По умолчанию собираем именно интеграционный flavor с тремя движками;
  # ABI x86_64 — чтобы тот же APK можно было проверить на эмуляторе GitHub.
  FLAVOR: ${{ github.event.inputs.flavor || 'chromium' }}
  API_LEVEL: ${{ github.event.inputs.api_level || '29' }}
  ABI: ${{ github.event.inputs.abi || 'x86_64' }}
  ENGINE: ${{ github.event.inputs.engine || 'Cefrium' }}

jobs:
  build:
    name: Сборка APK клиента Lampa
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # app/build.gradle считает versionCode через git rev-list origin/main

      - name: Проверка структуры клиента Lampa
        run: bash tools/verify-lampa-structure.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK (compileSdk 36)
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "нет sdkmanager в $ANDROID_SDK_ROOT" >&2; ls -la "$ANDROID_SDK_ROOT" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null
          "$SDKMANAGER" --list_installed | sed -n '1,25p'

      - name: Разрешения на gradlew
        run: chmod +x gradlew

      - name: Скачать и подготовить рантайм Cefrium (flavor chromium)
        if: ${{ env.FLAVOR == 'chromium' }}
        run: |
          set -euo pipefail
          mkdir -p work artifacts
          # arm64-v8a — кастомный AC3/EAC3-AAR из релиза; x86_64 — multi-ABI SDK из maven (нужен эмулятору)
          if [[ "$ABI" == "arm64-v8a" ]]; then
            url="https://github.com/ARST113/lampa-chromium-android/releases/download/cefrium-0.9.2-chromium-152-ac3-arm64-r8/cefrium-sdk-arm64-ac3.aar"
            name="cefrium-sdk-arm64-ac3.aar"
          else
            url="https://codeberg.org/api/packages/cefrium/maven/com/cefrium/cefrium-sdk/0.9.2/cefrium-sdk-0.9.2.aar"
            name="cefrium-sdk-0.9.2.aar"
          fi
          curl -sSL --fail -o "work/$name" "$url"
          sha256sum "work/$name" | tee artifacts/runtime-aar.sha256
          unzip -o -q "work/$name" classes.jar -d work/aar
          # Классы SDK собраны JDK 25 (major 69) — D8 из AGP 8.10 их не принимает,
          # поэтому понижаем версию class-файлов до Java 11.
          python3 tools/downgrade_class_version.py work/aar/classes.jar work/aar/classes-55.jar 55 | tee artifacts/runtime-downgrade.log
          python3 tools/repack_aar.py "work/$name" work/aar/classes-55.jar "work/cefrium-stage.aar"
          ls -la work/cefrium-stage.aar

      - name: Срезать из AAR Cefrium дублирующиеся ресурсы
        if: ${{ env.FLAVOR == 'chromium' }}
        run: |
          set -euo pipefail
          # AAR ещё не в app/libs, поэтому список содержит только остальные зависимости —
          # их определения ресурсов остаются, а копии внутри AAR убираются.
          ./gradlew --no-daemon -q :app:printChromiumRuntimeArtifacts > work/classpath.txt
          echo "артефактов в класспути: $(wc -l < work/classpath.txt)"
          python3 tools/slim_aar_resources.py work/cefrium-stage.aar "app/libs/cefrium-sdk-$ABI.aar" work/classpath.txt | tee artifacts/slim-aar.log
          ls -la app/libs/

      - name: Сборка ${FLAVOR}Debug
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./gradlew --no-daemon ":app:assemble${FLAVOR^}Debug" -Pabi="$ABI" --stacktrace 2>&1 | tee artifacts/gradle-build.log

      - name: Собрать APK и посчитать SHA256
        run: |
          set -euo pipefail
          log=$(printf '%s' "$FLAVOR" | tr '[:upper:]' '[:lower:]')
          dir="app/build/outputs/apk/$log/debug"
          apk=$(find "$dir" -maxdepth 1 -name '*.apk' 2>/dev/null | head -1)
          test -n "$apk" || { echo "APK не найден в $dir" >&2; ls -R app/build/outputs/apk || true; exit 1; }
          cp "$apk" "artifacts/Lampa-$FLAVOR-debug.apk"
          (cd artifacts && sha256sum "Lampa-$FLAVOR-debug.apk" | tee SHA256SUMS)
          ls -lh artifacts/

      - name: Выгрузка APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lampa-${{ env.FLAVOR }}-build-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  emulator:
    name: Проверка на эмуляторе
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_emulator != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Забрать собранный APK
        uses: actions/download-artifact@v4
        with:
          name: lampa-${{ env.FLAVOR }}-build-${{ github.run_number }}
          path: apk

      - name: Разложить APK туда, где его ищет smoke-скрипт
        run: |
          set -euo pipefail
          log=$(printf '%s' "$FLAVOR" | tr '[:upper:]' '[:lower:]')
          mkdir -p "app/build/outputs/apk/$log/debug"
          cp apk/*.apk "app/build/outputs/apk/$log/debug/"
          ls -la "app/build/outputs/apk/$log/debug/"

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: "Эмулятор: установка, запуск, logcat, скриншот"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/smoke_lampa.sh "$FLAVOR" "$ENGINE"

      - name: Выгрузка доказательств с эмулятора
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lampa-emulator-api${{ env.API_LEVEL }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
