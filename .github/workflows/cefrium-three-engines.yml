name: Build official Lampa + Cefrium (3 engines)

on:
  workflow_dispatch:
  push:
    branches:
      - official-cefrium-three-engines
    paths:
      - app/**
      - build-logic/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/wrapper/**
      - .github/workflows/cefrium-three-engines.yml

permissions:
  contents: read

concurrency:
  group: lampa-official-cefrium-three-engines
  cancel-in-progress: true

jobs:
  build:
    name: Full debug APK — Cefrium + XWalk + System WebView
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CEF_AAR: ${{ github.workspace }}/.cefrium/cefrium-sdk-arm64-ac3.aar
      CEF_SHA256: 1762fad19e262c76d75de3bed19472d1c6fa9479138d3dae12c3faa3824b3863
      CEF_URL: https://github.com/ARST113/lampa-chromium-android/releases/download/cefrium-0.9.2-chromium-152-ac3-arm64-r8/cefrium-sdk-arm64-ac3.aar

    steps:
      - name: Checkout official-Lampa fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download saved Chromium 152 AC3/EAC3 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CEF_AAR")"
          curl --fail --location --retry 4 --retry-all-errors "$CEF_URL" -o "$CEF_AAR"
          echo "$CEF_SHA256  $CEF_AAR" | sha256sum --check -
          ls -lh "$CEF_AAR"

      - name: Build official Lampa fullDebug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug \
            -PcefriumAar="$CEF_AAR" \
            -PcefriumSha256="$CEF_SHA256" \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk/full/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" artifacts/Lampa-v1.13.1-Cefrium-Chromium152-3engines-arm64-debug.apk
          sha256sum artifacts/*.apk | tee artifacts/SHA256SUMS
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lampa-Cefrium-3engines-arm64-${{ github.run_number }}
          path: |
            artifacts/Lampa-v1.13.1-Cefrium-Chromium152-3engines-arm64-debug.apk
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
