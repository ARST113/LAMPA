name: Runtime dex probe (Cefrium SDK vs AGP 8.10)

# Решающий эксперимент: может ли сборочный стек LAMPA (AGP 8.10 / D8-R8)
# декоировать Java-классы Cefrium SDK, собранные JDK 25 (class-файлы major 69).
# Проверяем три варианта: как есть (69), понижение до Java 21 (65) и до Java 11 (55).
on:
  workflow_dispatch:
  push:
    branches: [feature/chromium-ac3-runtime]
    paths:
      - '.github/workflows/runtime-dex-probe.yml'
      - 'tools/downgrade_class_version.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDK_URL: https://codeberg.org/api/packages/cefrium/maven/com/cefrium/cefrium-sdk/0.9.2/cefrium-sdk-0.9.2.aar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android build-tools (d8)
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;35.0.0" "platform-tools" > /dev/null
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

      - name: Скачать SDK-AAR и распаковать classes.jar
        run: |
          set -euo pipefail
          mkdir -p artifacts work
          curl -sSL --fail -o work/sdk.aar "$SDK_URL"
          ls -la work/sdk.aar
          sha256sum work/sdk.aar | tee artifacts/sdk-aar.sha256
          unzip -o -q work/sdk.aar classes.jar -d work/
          ls -la work/classes.jar

      - name: Собрать варианты байткода
        run: |
          set -euo pipefail
          python3 tools/downgrade_class_version.py work/classes.jar work/classes-65.jar 65 | tee artifacts/downgrade-65.log
          python3 tools/downgrade_class_version.py work/classes.jar work/classes-55.jar 55 | tee artifacts/downgrade-55.log

      - name: D8: исходный байткод (major 69)
        continue-on-error: true
        run: |
          D8="$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          set +e
          "$D8" --min-api 23 --output work/dex-69 work/classes.jar > artifacts/d8-major69.log 2>&1
          echo "exit=$?" | tee -a artifacts/d8-major69.log
          tail -25 artifacts/d8-major69.log

      - name: D8: понижение до Java 21 (major 65)
        continue-on-error: true
        run: |
          D8="$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          set +e
          "$D8" --min-api 23 --output work/dex-65 work/classes-65.jar > artifacts/d8-major65.log 2>&1
          echo "exit=$?" | tee -a artifacts/d8-major65.log
          tail -25 artifacts/d8-major65.log

      - name: D8: понижение до Java 11 (major 55)
        continue-on-error: true
        run: |
          D8="$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          set +e
          "$D8" --min-api 23 --output work/dex-55 work/classes-55.jar > artifacts/d8-major55.log 2>&1
          echo "exit=$?" | tee -a artifacts/d8-major55.log
          tail -25 artifacts/d8-major55.log

      - name: Итог эксперимента
        run: |
          {
            echo "=== D8 по вариантам ==="
            for v in 69 65 55; do
              f="artifacts/d8-major$v.log"
              code=$(grep -o 'exit=[0-9]*' "$f" | tail -1)
              dex=$(find "work/dex-$v" -name '*.dex' 2>/dev/null | wc -l)
              size=$(du -sh "work/dex-$v" 2>/dev/null | cut -f1)
              echo "major $v: $code | dex-файлов: $dex | размер: ${size:-0}"
            done
            echo
            echo "=== Ключевые строки ошибок (если были) ==="
            grep -h -m 3 -E "Unsupported class file|major version|error:|Error:" artifacts/d8-major*.log || echo "ошибок не найдено"
          } | tee artifacts/summary.txt

      - name: Выгрузка результатов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dex-probe-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
