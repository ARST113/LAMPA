name: AEC3 R8 maximum shrink experiment
on:
  push:
    branches: [optimize/aec3-r8]
    paths: [app/build.gradle, app/proguard-rules.pro, .github/workflows/aec3-r8.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CEF_AAR: ${{ github.workspace }}/.cefrium/cefrium-sdk-arm64-ac3.aar
      CEF_SHA256: 1762fad19e262c76d75de3bed19472d1c6fa9479138d3dae12c3faa3824b3863
      CEF_URL: https://github.com/ARST113/lampa-chromium-android/releases/download/cefrium-0.9.2-chromium-152-ac3-arm64-r8/cefrium-sdk-arm64-ac3.aar
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: gradle }
      - name: SDK and pinned Chromium AC3/EAC3 runtime
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          mkdir -p .cefrium artifacts
          curl --fail --location --retry 4 --retry-all-errors "$CEF_URL" -o "$CEF_AAR"
          echo "$CEF_SHA256  $CEF_AAR" | sha256sum --check -
          unzip -p "$CEF_AAR" jni/arm64-v8a/libcef.so | sha256sum > artifacts/native-source.sha256
          python3 scripts/patch-cefrium-aar.py "$CEF_AAR"
          python3 scripts/strip-cefrium-bundled-libs.py "$CEF_AAR"
          python3 scripts/aec3-r8-patch-consumer.py "$CEF_AAR"
      - name: Build with R8 code and resource shrinking
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLiteRelease -PcefriumAar="$CEF_AAR" -PcefriumSha256="$CEF_SHA256" > "$RUNNER_TEMP/r8-build.log" 2>&1
      - name: Report bounded compiler failure categories
        if: failure()
        run: |
          python3 - <<'PY'
          import json, re, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'r8-build.log'
          text = p.read_text(errors='replace') if p.exists() else ''
          classes = sorted(set(re.findall(r'Missing class ([A-Za-z0-9_.$]+)', text)))
          classes = [c for c in classes if c.startswith(('org.chromium.', 'com.google.', 'androidx.', 'javax.', 'org.jetbrains.', 'kotlin.'))]
          r = {'missing_class_count': len(classes), 'missing_library_classes': classes[:200],
               'out_of_memory': 'OutOfMemoryError' in text or 'Java heap space' in text,
               'duplicate_classes': 'Duplicate class' in text,
               'unsupported_rule': 'Unknown option' in text or 'Unsupported option' in text}
          Path('artifacts/failure-summary.json').write_text(json.dumps(r, indent=2))
          print(json.dumps(r, indent=2))
          PY
      - name: Verify native preservation and sign separate test package
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/lite/release -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -p "$APK" lib/arm64-v8a/libcef.so | sha256sum > artifacts/native-output.sha256
          diff artifacts/native-source.sha256 artifacts/native-output.sha256
          export AEC3_TEST_PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/aec3-r8-test.jks" -alias aec3-test -storepass:env AEC3_TEST_PASS -keypass:env AEC3_TEST_PASS -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=AEC3 R8 Compression Test' > /dev/null 2>&1
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aec3-r8-test.jks" --ks-key-alias aec3-test --ks-pass env:AEC3_TEST_PASS --key-pass env:AEC3_TEST_PASS --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out artifacts/Lampa-AEC3-R8-TEST.apk aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs artifacts/Lampa-AEC3-R8-TEST.apk > artifacts/signature-report.txt
          "$TOOLS/aapt2" dump badging artifacts/Lampa-AEC3-R8-TEST.apk > artifacts/package-report.txt
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          stat -c '%s' artifacts/*.apk > artifacts/size.txt
          cp app/build/outputs/mapping/liteRelease/{mapping,configuration,usage}.txt artifacts/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEC3-R8-${{ github.run_number }}
          path: |
            artifacts/
            app/build/outputs/mapping/liteRelease/missing_rules.txt
          compression-level: 6
          retention-days: 30
          if-no-files-found: warn

