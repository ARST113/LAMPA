name: Build Cefrium Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK with Chromium 152 compatibility fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Patch AndroidX core version for Chromium 152
        run: |
          sed -i "s/def coreKtxVer = '1.12.0'/def coreKtxVer = '1.16.0'/" app/build.gradle
          grep coreKtxVer app/build.gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lampa-cefrium-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
