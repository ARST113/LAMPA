name: Embedded Just+ APK

on:
  push:
    branches:
      - embedded-justplus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LAMPA with embedded Just+ Player
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout LAMPA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Just+ Player fork
        uses: actions/checkout@v4
        with:
          repository: ARST113/just-plus-player2
          ref: master
          path: justplus
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare embedded player modules
        run: |
          python3 ci/prepare_embedded_justplus.py

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build installable debug APK
        run: ./gradlew :app:assembleLiteDebug --stacktrace --no-daemon

      - name: Show APK
        if: success()
        run: ls -lh app/build/outputs/apk/lite/debug/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LAMPA-Embedded-JustPlus-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 30