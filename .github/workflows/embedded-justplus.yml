name: Embedded Just+ APK

on:
  push:
    branches:
      - embedded-justplus
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-justplus-build
  cancel-in-progress: true

jobs:
  build:
    name: Build LAMPA with embedded Just+ Player
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout LAMPA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Just+ Player fork
        uses: actions/checkout@v4
        with:
          repository: ARST113/just-plus-player2
          ref: master
          path: justplus
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android 36 platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare embedded player modules
        run: |
          python3 ci/prepare_embedded_justplus.py

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build installable debug APK
        run: ./gradlew :app:assembleLiteDebug --stacktrace --no-daemon

      - name: Show APK
        if: success()
        run: ls -lh app/build/outputs/apk/lite/debug/

      - name: Smoke test APK in Android emulator
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/smoke_android.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LAMPA-Embedded-JustPlus-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 30