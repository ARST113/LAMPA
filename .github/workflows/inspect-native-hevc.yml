name: Inspect Native HEVC source

on:
  push:
    branches:
      - inspect-native-hevc-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Native sources asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.13.0-native.2 \
            -R ARST113/LAMPA \
            -p 'Lampa-Native-1.13.0-native.2-sources.zip' \
            -D /tmp/native
          sha256sum /tmp/native/Lampa-Native-1.13.0-native.2-sources.zip
          mkdir -p /tmp/src
          unzip -q /tmp/native/Lampa-Native-1.13.0-native.2-sources.zip -d /tmp/src

      - name: Inspect HEVC implementation
        run: |
          {
            echo '=== TOP LEVEL ==='
            find /tmp/src -maxdepth 3 -type d | sort | head -200
            echo
            echo '=== FILES MATCHING HEVC / FFMPEG / DECODER ==='
            find /tmp/src -type f | grep -Ei 'hevc|ffmpeg|decoder|renderer|media3|justplus' | sort | head -1000
            echo
            echo '=== GREP HEVC / FFMPEG / RExt / libavcodec ==='
            grep -RniE 'HEVC|H265|H\.265|RExt|4:4:4|libavcodec|FfmpegVideo|FFmpegVideo|software.*video|video.*software' /tmp/src \
              --include='*.java' --include='*.kt' --include='*.cpp' --include='*.cc' --include='*.c' \
              --include='*.h' --include='*.gradle' --include='*.kts' --include='*.md' --include='*.txt' \
              2>/dev/null | head -3000 || true
            echo
            echo '=== AAR / SO HASHES ==='
            find /tmp/src -type f \( -name '*.aar' -o -name '*.so' \) -print0 | sort -z | xargs -0 sha256sum || true
          } > /tmp/hevc-inspection.txt

      - name: Collect relevant source
        run: |
          mkdir -p /tmp/hevc-files
          while IFS= read -r f; do
            rel="${f#/tmp/src/}"
            mkdir -p "/tmp/hevc-files/$(dirname "$rel")"
            cp "$f" "/tmp/hevc-files/$rel"
          done < <(find /tmp/src -type f \( \
            -iname '*ffmpeg*' -o -iname '*hevc*' -o -iname '*decoder*' -o \
            -name 'PlayerActivity.java' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o \
            -path '*/app/libs/*' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \
          \))
          cp /tmp/hevc-inspection.txt /tmp/hevc-files/

      - uses: actions/upload-artifact@v4
        with:
          name: native-hevc-source-inspection
          path: /tmp/hevc-files
          if-no-files-found: error
          retention-days: 30
