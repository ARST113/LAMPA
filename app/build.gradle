plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.cefrium'
}

def customCefrium = project.findProperty('cefriumAar')
def customCefriumSha256 = project.findProperty('cefriumSha256')
if (customCefrium && !(customCefriumSha256 ==~ /[0-9a-f]{64}/)) {
    throw new GradleException('A custom Cefrium AAR requires -PcefriumSha256=<64 lowercase hex digits>')
}

def getVersionCode = { ->
    try {
        def code = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'origin/main'
            standardOutput = code
        }
        return Integer.parseInt(code.toString().trim())
    }
    catch (ignored) {
        return 1
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--dirty'
            standardOutput = stdout
        }
        return stdout.toString().trim().replaceFirst("^v", "")
    }
    catch (ignored) {
        return '0.0.0'
    }
}

def getRepoId = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'remote', 'get-url', 'origin'
            standardOutput = stdout
        }
        def url = stdout.toString().trim()
        def matcher = (url =~ 'github\\.com[:/]([^/]+/[^/.]+)')
        if (matcher.find()) {
            return matcher.group(1)
        }
    }
    catch (ignored) {
        // fall through to default
    }
    return 'lampa-app/LAMPA'
}

android {
    //noinspection GradleDependency
    compileSdk 36
    defaultConfig {
        applicationId "top.rootu.lampa"
        minSdkVersion 29
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        versionCode getVersionCode()
        versionName getVersionName()
        buildConfigField "String", "REPO_ID", "\"${getRepoId()}\""
        multiDexEnabled = true // required when setting minSdkVersion to 20 or lower
        // Use SupportLibrary for vectors
        vectorDrawables.useSupportLibrary = true
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropsFile = file("keystore/keystore_config")

            if (keystorePropsFile.exists()) {
                file("keystore/keystore_config").withInputStream { keystoreProperties.load(it) }
                storeFile file("$keystoreProperties.storeFile")
                storePassword "$keystoreProperties.storePassword"
                keyAlias "$keystoreProperties.keyAlias"
                keyPassword "$keystoreProperties.keyPassword"
            } else if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_SIGN_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_SIGN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        // https://developer.android.com/studio/write/java8-support-table
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    // gradle 4.6 migration: disable dimensions mechanism
    // more: https://proandroiddev.com/advanced-android-flavors-part-4-a-new-version-fc2ad80c01bb
    flavorDimensions "default"

    productFlavors {
        lite {
            buildConfigField "boolean", "enableUpdate", "true"
            buildConfigField "String", "defaultAppUrl", "\"\""
        }
        full {
            buildConfigField "boolean", "enableUpdate", "false"
            buildConfigField "String", "defaultAppUrl", "\"\""
        }
        ruStore {
            versionNameSuffix "-RuStore"
            minSdk 24 // minSdk RuStore.apk
            buildConfigField "boolean", "enableUpdate", "false"
            buildConfigField "String", "defaultAppUrl", "\"http://lampa.mx\""
        }
    }

    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    sourceSets {
        main {
            java {
                exclude 'org/xwalk/**'
                exclude 'top/rootu/lampa/browser/XWalk.kt'
            }
        }
    }
    namespace 'top.rootu.lampa'
}

configurations.configureEach {
    // Cefrium is a fat AAR and already carries these classes/resources.
    exclude group: 'androidx.window', module: 'window'
    exclude group: 'androidx.window', module: 'window-java'
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    if (customCefrium) {
        implementation files(customCefrium)
    } else {
        implementation 'com.cefrium:cefrium-sdk:0.9.2'
    }
    // https://developer.android.com/studio/write/java8-support#library-desugaring
    //noinspection GradleDependency 2.0.4 for AGP 7.4
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def actKtxVer = '1.8.0' // 1.8.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.activity:activity-ktx:$actKtxVer"
    def appCompatVer = '1.6.1' // 1.6.1 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.appcompat:appcompat:$appCompatVer"
    def constraintVersion = '2.1.4' // 2.1.4 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.constraintlayout:constraintlayout:${constraintVersion}"
    // Cefrium's Chromium 152 Java code calls androidx.core.os.BuildCompat.isAtLeastB(),
    // which exists only since androidx.core 1.16.0. With the old 1.12.0 pin the APK linked
    // against a BuildCompat without that method, Chromium threw NoSuchMethodError from JNI
    // and killed the process (SIGTRAP) in a restart loop. This branch is minSdk 29, so the
    // "last api16 compatible" pin no longer applies.
    def coreKtxVer = '1.16.0'
    //noinspection GradleDependency
    implementation "androidx.core:core-ktx:$coreKtxVer"
    // The Cefrium fat AAR ships Material Components and Lottie as *classes only* -- it
    // contains no androidx classes at all, and this branch removed their Maven
    // coordinates. Every androidx library their bytecode links against therefore has to
    // be declared here explicitly (measured from the AAR itself):
    //   FloatingActionButton -> dynamicanimation, coordinatorlayout
    //   TabLayout / carousel -> recyclerview, viewpager, viewpager2, cardview
    //   shape theming        -> graphics-shapes
    // Material Components and Lottie are NOT taken from the AAR: its copies carry only
    // Chromium's whitelisted resource slice (see scripts/strip-cefrium-bundled-libs.py),
    // so the app needs the real artifacts with their complete resources.
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.airbnb.android:lottie:6.4.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    def lifecycleVersion = '2.6.2' // 2.6.2 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-process:$lifecycleVersion"
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recommendation:recommendation:1.0.0'
    //noinspection GradleDependency
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    def vectordrawableVersion = '1.1.0' // 1.1.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.vectordrawable:vectordrawable:${vectordrawableVersion}"
    def webkitVersion = '1.8.0' // 1.8.0 - last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.webkit:webkit:$webkitVersion"
    def glideVersion = '5.0.5' // glide stable
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    implementation("com.github.bumptech.glide:okhttp3-integration:${glideVersion}") {
        exclude group: 'glide-parent'
        transitive = false
    }
    ksp "com.github.bumptech.glide:ksp:${glideVersion}"
    implementation "com.github.bumptech.glide:annotations:${glideVersion}"
    def okhttpVersion = '3.12.13' // okhttp 3.12.13 - latest version for API < 21
    //noinspection GradleDependency
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    //noinspection GradleDependency
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:$okhttpVersion"
    implementation 'org.brotli:dec:0.1.2'
    //noinspection GradleDependency
    def coroutinesVersion = '1.7.3' // 1.7.3 - last compatible with kp 1.8.22
    //noinspection GradleDependency
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    //noinspection GradleDependency 2.10.x thorow java.lang.VerifyError on api17
    implementation 'com.google.code.gson:gson:2.9.1'
    //noinspection GradleDependency 6.6.2+ throw NullPointerException on build
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0' // SSL / TLS
    implementation 'junit:junit:4.13.2' // For Crosswalk compatibility
    implementation 'org.conscrypt:conscrypt-android:2.5.3' // for TLS v1.3 on API < 29
    //noinspection GradleDependency 1.8.1 fails on build with old gradle
    implementation 'org.mozilla:rhino:1.7.15' // JavaScript to run PAC file to get correct proxies
    // crosswalk latest
}